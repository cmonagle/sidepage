<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sidepage Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>Sidepage Settings</h1>

  <form id="settings-form">
    <div class="form-group">
      <label for="homeUrl">Home Page URL:</label>
      <input type="url" id="homeUrl" name="homeUrl" placeholder="https://example.com" required>
    </div>

    <button type="submit">Save Settings</button>

    <div id="status" class="status"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>
