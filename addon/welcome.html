<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sidepage</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      padding: 40px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    p {
      color: #666;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #333;
    }
    input[type="url"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background-color: #0060df;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    button:hover {
      background-color: #003eaa;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      text-align: center;
    }
    .status.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Configure your Sidepage</h1>
    <p>Set your preferred URL below. The sidebar will load this URL when opened.</p>

    <form id="settings-form">
      <div class="form-group">
        <label for="homeUrl">Sidepage URL:</label>
        <input type="url" id="homeUrl" name="homeUrl" placeholder="https://example.com" required>
      </div>
      <button type="submit">Save & Load</button>
      <div id="status" class="status"></div>
    </form>
  </div>

  <script src="welcome.js"></script>
</body>
</html>
